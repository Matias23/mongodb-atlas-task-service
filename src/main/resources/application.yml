logging.level.org.springframework.data.mongodb.core.MongoTemplate: DEBUG
spring:
  application:
    name: mongodb-atlas-task-service
  cache:
    type: caffeine
    cache-names: tasks,taskLists
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s,recordStats
  threads:
    virtual:
      enabled: true
  mongodb:
    # Atlas: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/tasks?retryWrites=true&w=majority
    uri: ${MONGODB_URI:mongodb://localhost:27017/tasks}
  config:
    import: optional:file:./application-local.yml
server:
  port: 8083
